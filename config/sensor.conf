#===================================================================
# 后备电源检测系统 运行配置
#
# 语法：键 = 值     '#' 开头是注释，也可以写在值后面
# 文件不存在时程序会用内置默认值继续跑，不会直接退出
#===================================================================

#---------------- 串口 / 组网 ----------------
# 三种模式，改这一行就切换，代码不用动：
#   sim                     内置模拟源（5 分钟工况循环），不接硬件也能跑通全链路
#   /dev/ttymxc2            单板直连，走自定义 AA55 帧
#   modbus:/dev/ttymxc2     Modbus RTU 主机，轮询 LoRa 网关下的多个电池组
serial_dev  = sim
serial_baud = 115200

#---------------- 采集 ----------------
sample_period_ms = 1000
dev_id           = 1
# Modbus 模式下轮询几个电池组节点（1~247）
slave_count      = 1

#---------------- 告警阈值 ----------------
# 48V 后备电源组的常见工作区间，按现场电池型号调
temp_max   = 60.0
hum_max    = 95.0
volt_min   = 46.0
volt_max   = 50.5
curr_max   = 5.0
smoke_max  = 300.0

#---------------- 存储 ----------------
# 板子上建议放 /var/lib/basestation/sensor.db
db_path     = sensor.db
retain_days = 7

#---------------- 上报(自建上位机，裸 TCP 行协议) ----------------
upload_enable = 1
upload_host   = 127.0.0.1
upload_port   = 9527

#---------------- MQTT 云平台 ----------------
# 本地先用 mosquitto 试，换云就改地址；账号密码在 broker 侧或者网关配置
mqtt_enable = 1
mqtt_host   = 127.0.0.1
mqtt_port   = 1883

#---------------- 摄像头（OV5647 / OV5640） ----------------
# 只在"严重"告警时抓拍，存到 snapshot_dir
camera_enable = 1
camera_dev    = /dev/video1
camera_width  = 640
camera_height = 480
snapshot_dir  = snapshots

#---------------- 显示（LVGL，800x480 framebuffer + 触摸） ----------------
# 没有 /dev/fb0 时自动转成 headless，只跑数据链路
ui_enable = 1

#---------------- 日志 ----------------
# 留空只打屏幕
# log_level: 0=只打错误 1=加警告 2=加常规信息 3=加调试(很啰嗦)
log_path  = monitor.log
log_level = 2
